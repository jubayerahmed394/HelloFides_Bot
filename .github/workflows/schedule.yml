name: HelloFides Bot

# Three jobs, one workflow, one delivery destination (the private "HelloFides"
# Telegram channel):
#  - personal_post: generates + sends a LinkedIn/Personal post (Sat, Mon, Wed 09:00 Asia/Dhaka)
#  - company_post:  generates + sends a Facebook/HelloFides post (Sun, Tue, Thu 19:00 Asia/Dhaka)
#  - poll_commands:  checks Telegram every 5 minutes for DM commands/button taps
#
# Cron times below are in UTC. Asia/Dhaka is UTC+6, so 09:00 Dhaka = 03:00 UTC,
# and 19:00 Dhaka = 13:00 UTC. If you change config.yaml's schedule, update the
# cron lines here to match.
#
# This workflow needs a PUBLIC repository to run for free without limit, because
# the 5-minute command-polling job runs ~288 times/day. GitHub Actions minutes are
# unlimited and free on public repos, but capped (2,000 min/month free) on private
# repos - at this frequency a private repo could exceed the free tier. See README.md.
#
# Photocards are rendered with a headless Chromium browser (Playwright). Its
# ~150MB download is cached between runs (keyed on the pinned version in
# requirements.txt) so it isn't re-downloaded on every single run.

# Re-saved 2026-10-24 to force GitHub to re-register the schedule trigger
# after it fired only once and then went quiet for the first several hours.
on:
  schedule:
    - cron: "0 3 * * 6,1,3"   # Personal/LinkedIn - Sat, Mon, Wed 09:00 Asia/Dhaka
    - cron: "0 13 * * 0,2,4"  # Company/Facebook - Sun, Tue, Thu 19:00 Asia/Dhaka
    - cron: "*/5 * * * *"     # Poll Telegram for DM commands/button taps
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually (for testing)"
        required: true
        default: "poll"
        type: choice
        options:
          - poll
          - personal
          - company

permissions:
  contents: write

jobs:
  personal_post:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 6,1,3') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'personal')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: hellofides-personal-post
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Generate and send Personal/LinkedIn post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py scheduled --mode personal
      - name: Save bot state
        if: always()
        run: bash .github/workflows/commit_state.sh

  company_post:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 0,2,4') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'company')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: hellofides-company-post
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Generate and send Company/Facebook post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py scheduled --mode company
      - name: Save bot state
        if: always()
        run: bash .github/workflows/commit_state.sh

  poll_commands:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'poll')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: hellofides-poll
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Poll Telegram for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py poll
      - name: Save bot state
        if: always()
        run: bash .github/workflows/commit_state.sh
