name: HelloFides Bot

# Two jobs, one workflow, one delivery destination (the private "HelloFides"
# Telegram channel):
#  - daily_batch:    sends config.yaml's schedule.daily.count photocards
#                     (alternating Personal/Company), once a day at 17:00 Asia/Dhaka
#  - poll_commands:  checks Telegram every 5 minutes for DM commands/button taps
#
# Cron times below are in UTC. Asia/Dhaka is UTC+6, so 17:00 Dhaka = 11:00 UTC.
# If you change config.yaml's schedule.daily.time, update the cron line here too.
#
# This workflow needs a PUBLIC repository to run for free without limit, because
# the 5-minute command-polling job runs ~288 times/day. GitHub Actions minutes are
# unlimited and free on public repos, but capped (2,000 min/month free) on private
# repos - at this frequency a private repo could exceed the free tier. See README.md.
#
# Photocards are rendered with a headless Chromium browser (Playwright). Its
# ~150MB download is cached between runs (keyed on the pinned version in
# requirements.txt) so it isn't re-downloaded on every single run.

on:
  schedule:
    - cron: "0 11 * * *"     # Daily batch - every day, 17:00 Asia/Dhaka
    - cron: "*/5 * * * *"    # Poll Telegram for DM commands/button taps
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually (for testing)"
        required: true
        default: "poll"
        type: choice
        options:
          - poll
          - daily
          - personal
          - company

permissions:
  contents: write

jobs:
  daily_batch:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: hellofides-daily-batch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Send today's photocard batch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py daily
      - name: Save bot state
        if: always()
        run: bash .github/workflows/commit_state.sh

  single_post:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.job == 'personal' || github.event.inputs.job == 'company')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: hellofides-single-post
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Generate and send one on-demand post (manual testing)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py scheduled --mode ${{ github.event.inputs.job }}
      - name: Save bot state
        if: always()
        run: bash .github/workflows/commit_state.sh

  poll_commands:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'poll')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: hellofides-poll
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Poll Telegram for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py poll
      - name: Save bot state
        if: always()
        run: bash .github/workflows/commit_state.sh
